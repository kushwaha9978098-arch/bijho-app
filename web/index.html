<script>
var MB=[];
function modal(msg,btns,big){MB=btns;var e=$('mdl');if(!e)return;e.innerHTML='<div class="ov"><div class="dlg"><p>'+esc(msg)+'</p>'+(big?'<div class="big'+(String(big).length>10?' sm':'')+'">'+esc(big)+'</div>':'')+'<div class="two">'+btns.map(function(b,i){return '<button class="btn'+(b[2]?' g':'')+'" onclick="mb('+i+',this)">'+esc(b[0])+'</button>'}).join('')+'</div></div></div>'}

function copyTxt(t,el){function done(){el.textContent='✅ कॉपी हो गया'}function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}

function yn(msg,yes){modal(msg,[['नहीं',null,1],['हाँ',yes]])}
var AS=['Hindi','English','Math','Science','Social Science','Sanskrit','Physics','Chemistry','Maths','Biology','History','Political Science','Geography','Economics','Sociology','Psychology','Philosophy','Accountancy','Business Studies','Business Maths'];
var IC={Hindi:'📖',English:'🔤',Math:'🧮',Maths:'🧮','Business Maths':'🧮',Science:'🔬','Social Science':'🌍',Sanskrit:'🕉️',Physics:'⚛️',Chemistry:'🧪',Biology:'🍃',History:'📜','Political Science':'🏛️',Geography:'🗺️',Economics:'📈',Sociology:'👥',Psychology:'🧠',Philosophy:'💭',Accountancy:'🧾','Business Studies':'💼'};
var TK='bijho_tok',AK='bijho_atok',tmr;
var S={view:'boot',tab:'home',me:null,subs:[],err:'',cls:8,stream:'Science',sub:null,chs:[],chT:'',notes:[],tsub:null,tests:[],hist:[],T:null,R:null,chat:[],left:null,aps:null,achs:[],busy:false,vids:[],play:null,dling:{},links:{instagram:'',facebook:'',youtube:'',whatsapp:''}};
function $(i){return document.getElementById(i)}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tok(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function setTok(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
function api(path,o,role){o=o||{};var h={},K=role=='a'?AK:TK,t=tok(K);if(t)h['Authorization']='Bearer '+t;
 if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json);delete o.json}o.headers=h;
 return fetch(path,o).then(function(r){return r.json().catch(function(){return{}}).then(function(d){
  if(r.status==401&&t&&!/\/(login|register|change-credentials|me\/password|admin\/recover)$/.test(path)){setTok(K,'');S.me=null;go('welcome');throw new Error(d.error||'Session khatam, dobara login karo')}
  if(!r.ok)throw new Error(d.error||'Kuch gadbad hui, dobara try karo');if(d.token)setTok(K,d.token);return d})})}
function go(v,t){S.view=v;S.err='';if(t)S.tab=t;draw()}
function fail(e){S.err=e.message||'Kuch gadbad hui';S.busy=false;draw()}
function val(i){return $(i)?$(i).value.trim():''}
function logout(){setTok(TK,'');setTok(AK,'');S.me=null;S.chat=[];setDL([]);if(window.caches)caches.delete('bijho-videos');go('welcome')}
function loadLinks(){api('/api/links').then(function(d){S.links=d;drawSoc()}).catch(function(){})}
function boot(){loadLinks();if(tok(AK)){api('/api/admin/stats',{},'a').then(function(d){S.aps=d;go('adminhome')}).catch(function(){logout()});return}
 if(tok(TK)){api('/api/me').then(function(d){S.me=d.student;enter()}).catch(function(e){go(e instanceof TypeError?'offline':'welcome')});return}go('welcome')}
function enter(){api('/api/subjects').then(function(d){S.subs=d.subjects;go('home','home')}).catch(fail)}
function login(){api('/api/login',{method:'POST',json:{mobile:val('m'),password:$('p').value}}).then(function(d){S.me=d.student;enter()}).catch(fail)}
function reg(){if(!$('ok').checked){S.err='Privacy Policy manna zaroori hai';return draw()}
 api('/api/register',{method:'POST',json:{name:val('n'),mobile:val('m'),password:$('p').value,class:S.cls,stream:S.cls>10?S.stream:null,accept_privacy:true}}).then(function(d){S.me=d.student;enter()}).catch(fail)}

function openPdf(i,dl){var n=S.notes[i],w=dl?null:window.open('','_blank');api('/api/notes/'+n.id+'/link').then(function(d){
 if(dl||!w){var a=document.createElement('a');a.href=d.url+(dl&&d.url.charAt(0)=='/'?'?dl=1':'');if(dl)a.download=n.title+'.pdf';else{a.target='_blank';a.rel='noopener'}document.body.appendChild(a);a.click();a.remove()}else w.location.href=d.url}).catch(function(e){if(w)w.close();fail(e)})}
function playV(i){var v=S.vids[i];if(v.kind=='youtube'){S.play={title:v.title,yt:v.yt,back:'chap'};return go('play')}
 api('/api/videos/'+v.id+'/link').then(function(d){S.play={title:v.title,src:d.url,back:'chap'};go('play')}).catch(fail)}

 api('/api/videos/'+v.id+'/link').then(function(d){return fetch(d.url)}).then(function(r){if(!r.ok)throw new Error('वीडियो डाउनलोड नहीं हुआ');return caches.open('bijho-videos').then(function(c){return c.put('/offline/v/'+v.id,r)})}).then(function(){var a=DL().filter(function(x){return x.id!=v.id});a.push({id:v.id,title:v.title,size:v.size});setDL(a);delete S.dling[v.id];draw()}).catch(function(e){delete S.dling[v.id];fail(new Error(e&&e.name=='QuotaExceededError'?'फ़ोन में जगह कम है':(e&&e.message)||'डाउनलोड नहीं हुआ'))})}

function openTs(i){S.tsub=S.subs[i];api('/api/tests?subject='+encodeURIComponent(S.tsub)).then(function(d){S.tests=d.tests;draw()}).catch(fail)}
function pickCount(i){var t=S.tests[i],n=t.questions;if(n<10)return startT(i);var o=[];for(var c=10;c<=Math.min(n,100);c+=10)o.push(c);if(o[o.length-1]!==n)o.push(n);
 modal('📝 '+t.title+'\nकितने सवाल का Quiz देना है?\n(हर बार सवाल अलग-अलग आएँगे और समय सवालों के हिसाब से अपने-आप घट जाएगा)',o.map(function(c){return [c==n?'सभी '+c:String(c),function(){startT(i,c)}]}).concat([['रद्द करें',null,1]]))}
function startT(i,count){var t=S.tests[i];api('/api/tests/'+t.id+'/start',{method:'POST',json:count?{count:count}:{}}).then(function(d){S.T={aid:d.attempt_id,title:d.title,qs:d.questions,end:Date.now()+d.seconds_left*1000,i:0,a:{}};go('testrun');clearInterval(tmr);tmr=setInterval(tick,1000)}).catch(fail)}
function tick(){if(!S.T||S.view!='testrun')return;var l=Math.max(0,Math.round((S.T.end-Date.now())/1000)),e=$('tm');if(e)e.textContent='⏱ '+Math.floor(l/60)+':'+('0'+l%60).slice(-2);if(!l)submitT()}
function pickA(i){S.T.a[S.T.qs[S.T.i].id]=i;draw()}
function nav(d){S.T.i+=d;draw()}
function askSubmit(){var T=S.T,n=T.qs.filter(function(q){return T.a[q.id]!==undefined}).length,left=T.qs.length-n;yn('आपने '+T.qs.length+' में से '+n+' सवालों के उत्तर दिए हैं'+(left?' ('+left+' बाक़ी)':'')+'।\nTest जमा करें? जमा करने के बाद बदल नहीं सकते।',submitT)}
function submitT(){if(!S.T||S.busy)return;S.busy=true;clearInterval(tmr);var T=S.T;api('/api/attempts/'+T.aid+'/submit',{method:'POST',json:{answers:T.a}}).then(function(d){S.busy=false;S.R=d;S.T=null;go('result')}).catch(fail)}
function ask(){var q=val('q');if(q.length<2)return;S.chat.push({u:1,t:q});S.chat.push({t:'सोच रहा हूँ…'});S.busy=true;draw();
 api('/api/ai/ask',{method:'POST',json:{question:q}}).then(function(d){S.chat.pop();S.chat.push({t:d.answer});S.left=d.remaining;S.busy=false;draw()}).catch(function(e){S.chat.pop();S.chat.push({t:'⚠ '+e.message});S.busy=false;S.err='';draw()})}
